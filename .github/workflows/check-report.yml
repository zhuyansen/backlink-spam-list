name: Check a report

# A new report gets a free check: the reported site's own pages read by backlink-guard, and the
# evidence page searched for the words quoted. The answer is a comment; the list is not changed.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backlink-guard
        run: pip install "git+https://github.com/zhuyansen/backlink-guard@main"
      - name: Check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          OUT: comment.md
        run: python scripts/check_report.py
      - name: Reply
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: gh issue comment "$N" --body-file comment.md
