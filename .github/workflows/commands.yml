name: Maintainer commands

# /approve [category] and /reject on a report, /remove and /keep on a dispute, from the owner,
# a member or a collaborator, applied to list.csv. Everyone else's comments are ignored.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject') ||
       startsWith(github.event.comment.body, '/remove') || startsWith(github.event.comment.body, '/keep'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply
        id: apply
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          OUT: comment.md
        run: python scripts/apply_command.py
      - name: Commit
        if: steps.apply.outputs.commit == 'true'
        env:
          N: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add list.csv
          git commit -m "list: #$N"
          git push
      - name: Reply
        if: steps.apply.outputs.say == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          CLOSE: ${{ steps.apply.outputs.close }}
        run: |
          gh issue comment "$N" --body-file comment.md
          if [ "$CLOSE" = "true" ]; then gh issue close "$N"; fi
